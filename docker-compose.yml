services:
  mongo:
    image: mongo:7
    container_name: proximatrix-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: proximatrix
      MONGO_INITDB_ROOT_PASSWORD: changeme_proximatrix_2026
    volumes:
      - mongo-data:/data/db
    networks:
      - proximatrix-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  proximatrix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proximatrix-proxy
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PROXY_PUBLIC_IP: "aiquantums.ru"
      PROXY_SERVER_IP: "77.221.156.12"
      MTPROTO_SPONSOR_TAG: "08b314545389de5c415dd881f1babee4"
      MONGODB_URI: "mongodb://proximatrix:changeme_proximatrix_2026@mongo:27017/proximatrix?authSource=admin"
      PROXY_API_KEY: "proximatrix-api-key-change-in-production"
      NOTIFY_API_URL: "https://blacknetiv.ru"
      NOTIFY_SECRET: ""
    ports:
      - "8444:8444"
      - "9090:9090"
      - "1080:1080"
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./config.json:/app/config.json:ro
    networks:
      - proximatrix-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo-data:

networks:
  proximatrix-network:
    driver: bridge
